name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test core and CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not redundant here: several restore and locking paths are
        # platform-specific, and a directory rename behaves differently when a
        # handle inside it is still open.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      # `git commit-tree` refuses to run without an identity, and the ODB and
      # sync tests shell out to Git in throwaway repositories.
      - name: Configure Git identity
        run: |
          git config --global user.name "MineCommit CI"
          git config --global user.email "ci@minecommit.invalid"

      # Deliberately scoped to the Rust crates that do not need the Tauri
      # desktop toolchain; the GUI is covered by the release build jobs.
      - name: Run tests
        run: cargo test --package minecommit --package minecommit-cli

  frontend:
    name: Check the GUI frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: minecommit-gui
        run: bun install --frozen-lockfile

      # `invoke` resolves its arguments by name at runtime, so a renamed command
      # parameter type-checks and then fails in front of the user. Nothing else
      # in the build catches that, hence the dedicated check.
      - name: Typecheck and check Tauri command arguments
        working-directory: minecommit-gui
        run: bun run check
