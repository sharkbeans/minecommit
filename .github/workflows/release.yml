name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test core and CLI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      # `git commit-tree` refuses to run without an identity, and the ODB and
      # sync tests shell out to Git in throwaway repositories.
      - name: Configure Git identity
        run: |
          git config --global user.name "MineCommit CI"
          git config --global user.email "ci@minecommit.invalid"

      # Deliberately scoped to the Rust crates that do not need the Tauri
      # desktop toolchain; the GUI is covered by the build jobs below.
      - name: Run tests
        run: cargo test --package minecommit --package minecommit-cli

  frontend:
    name: Check the GUI frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: minecommit-gui
        run: bun install --frozen-lockfile

      # `invoke` resolves its arguments by name at runtime, so a renamed command
      # parameter type-checks and then fails in front of the user. The Tauri
      # build below compiles the frontend but cannot notice that.
      - name: Typecheck and check Tauri command arguments
        working-directory: minecommit-gui
        run: bun run check

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: minecommit
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: minecommit
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: minecommit
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: minecommit
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: minecommit
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: minecommit.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --package minecommit-cli --bin minecommit --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf minecommit-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
          mv minecommit-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ github.workspace }}/

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ${{ github.workspace }}/minecommit-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecommit-${{ matrix.target }}
          path: |
            minecommit-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            minecommit-${{ github.ref_name }}-${{ matrix.target }}.zip
          if-no-files-found: error

  build-tauri-windows:
    name: Build Tauri GUI (Windows)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: minecommit-gui

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Build portable Windows executable
        run: bun tauri build --ci --target x86_64-pc-windows-msvc --no-bundle

      - name: Prepare release artifact
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Copy-Item `
            target/x86_64-pc-windows-msvc/release/minecommit-gui.exe `
            MineCommit-${{ github.ref_name }}-x86_64-pc-windows-msvc.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecommit-gui-x86_64-pc-windows-msvc
          path: MineCommit-${{ github.ref_name }}-x86_64-pc-windows-msvc.exe
          if-no-files-found: error

  build-tauri-linux:
    name: Build Tauri GUI (Debian / LMDE)
    # Build on Tauri's supported compatibility baseline so the package also
    # runs on Debian-family distributions such as Linux Mint Debian Edition.
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: minecommit-gui

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Build Debian package and portable Linux archive
        run: bun tauri build --ci --target x86_64-unknown-linux-gnu --bundles deb

      - name: Prepare release artifact
        working-directory: ${{ github.workspace }}
        run: |
          cp target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb \
            MineCommit-${{ github.ref_name }}-x86_64.deb
          tar -C target/x86_64-unknown-linux-gnu/release \
            -czf MineCommit-GUI-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz \
            minecommit-gui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecommit-gui-debian-x86_64
          path: |
            MineCommit-${{ github.ref_name }}-x86_64.deb
            MineCommit-GUI-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs:
      - test
      - frontend
      - build
      - build-tauri-windows
      - build-tauri-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
